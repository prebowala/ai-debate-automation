name: Build AI Debate Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Post Checkout Repository
        uses: actions/checkout@v4

      - name: Post Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Run Debate Generation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROURED_API_KEY }}
        run: |
          python main.py

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-debate-video
          path: final_debate_output.mp4
