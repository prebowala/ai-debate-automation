name: Generate AI Debate Video

on:
  schedule:
    # Runs automatically every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy gTTS edge-tts

      - name: Run Debate Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated Video
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add final_debate.mp4
          git commit -m "Auto-generated AI Debate Video [skip ci]" || echo "No changes to commit"
          git push
