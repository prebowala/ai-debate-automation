name: Generate AI Debate Video (Chatterbox Turbo)

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Chatterbox
        run: |
          python -m pip install --upgrade pip
          # Installs PyTorch (CPU wheel fallback for standard runner environments)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Installs Chatterbox TTS package
          pip install chatterbox-tts requests

      - name: Run Pipeline Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-debate-video
          path: final_debate_output.mp4
