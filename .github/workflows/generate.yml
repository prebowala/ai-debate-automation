name: Generate Debate

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate-debate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix Ubuntu Mirrors
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.list || true

      - name: Install System Dependencies (espeak-ng & ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts requests gtts pillow accelerate diffusers

      - name: Run Debate Generation Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python main.py

      - name: Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-debate-output
          path: final_debate_output.mp4
