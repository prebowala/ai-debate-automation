name: Generate AI Debate Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (espeak-ng & ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts torch torchaudio requests einops perth librosa accelerate

      - name: Run Debate Generation Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python main.py

      - name: Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debate-video-output
          path: final_debate_output.mp4
