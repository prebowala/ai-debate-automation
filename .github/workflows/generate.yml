name: Generate AI Debate

on:
  push:
    paths:
      - 'topic.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests asyncio

      - name: Run Debate Engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py

      - name: Commit Audio & Scores back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add -f output_audio.mp3 scores.json || true
          git commit -m "Auto-generated debate assets" || true
          git push origin main || true

      - name: Upload Output Assets (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: debate-assets
          path: |
            output_audio.mp3
            scores.json
