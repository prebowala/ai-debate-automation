name: Generate AI Debate

on:
  workflow_dispatch:
  push:
    paths:
      - 'topic.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install requests asyncio moviepy pillow imageio-ffmpeg

      - name: Run Debate Engine & Video Renderer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py

      - name: Commit Assets back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add -f output_audio.mp3 scores.json final_debate.mp4 || true
          git commit -m "Auto-generated debate video assets" || true
          git push origin main || true

      - name: Upload Output Assets (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: debate-video-package
          path: |
            final_debate.mp4
            output_audio.mp3
            scores.json
