name: Generate AI Debate Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttf-dejavu

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests torch torchaudio

      - name: Run Debate Generation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python main.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-debate-video
          path: final_debate_output.mp4
