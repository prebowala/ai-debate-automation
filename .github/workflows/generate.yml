name: Generate Debate

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate-debate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: shimataro/ffmpeg-release-action@v7
        with:
          version: '6.1.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pillow

      - name: Run Debate Generation Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python main.py

      - name: Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-debate-output
          path: final_debate_output.mp4
