name: Generate Long-Form AI Debate Video

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  build_video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow edge-tts

    - name: Run Debate Video Pipeline
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # The roster now resolves to the strongest model each lab offers on your
        # account, so a run spends OpenRouter credit (roughly a dollar). Voice
        # and cues are still free: edge-tts narration and emoji.
        #
        # USE_PAID_MODELS: "0"                     # back to the free tier
        # DEBATER_LABS: anthropic,openai           # which two labs argue
        # DEBATER_MODELS: a/b,c/d                  # pin exact debaters
        # PANEL_MODELS: a/b,c/d                    # pin the exact panel
        # TTS_PROVIDER: elevenlabs                 # needs ELEVENLABS_API_KEY
        # ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        # CUE_STYLE: illustration                  # generated stills, needs IMAGE_PROVIDER
        # CUE_STYLE: animation                     # generated clips, billed per second
        # ANIMATE_CUES: "1"
      run: python main.py

    - name: Upload Final Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final_Debate_Video
        path: final_debate_output.mp4

    - name: Upload Description And Scores
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Debate_Data
        path: |
          video_description.txt
          scores.json
        if-no-files-found: warn
