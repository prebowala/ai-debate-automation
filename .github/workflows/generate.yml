name: Generate AI Debate Video

on:
  workflow_dispatch:
  schedule:
    # Optional: Automatically run daily at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Hard job kill switch to save GitHub Actions minutes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow gTTS numpy

      - name: Run Debate Generator
        timeout-minutes: 12 # Kills script early if an API hangs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated Video
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add final_debate.mp4
          git commit -m "Automated render: New AI Debate Video" || exit 0
          git push
